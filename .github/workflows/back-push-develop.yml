name: Backend's push to develop
on:
  workflow_dispatch:
  push:
    branches:
      - "develop"
    paths:
      - "back/**"
jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: docker hub login
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: docker hub push
        uses: docker/build-push-action@v6
        with:
          context: ./back
          push: true
          tags: junroot0909/nomat:latest, junroot0909/nomat:${{ github.sha }}
      - name: deploy to EC2
        env:
          PRIVATE_KEY: ${{ secrets.EC2_PRIVATE_KEY }}
          HOST: ${{ secrets.EC2_HOST }}
          USER: ${{ secrets.EC2_USER }}
        run: |
          echo "$PRIVATE_KEY" > github-ec2.pem && chmod 600 github-ec2.pem
          ssh -o StrictHostKeyChecking=no -i github-ec2.pem ${USER}@${HOST} '
          echo "Current directory: $(pwd)"
          
          REPO_URL="https://github.com/Junroot/Nomat.git"
          REPO_DIR="$HOME/Nomat"
          BRANCH=${GITHUB_REF##*/}
          
          if [ ! -d "$REPO_DIR/.git" ]; then
          git clone "$REPO_URL" "$REPO_DIR"
          fi
          
          cd "$REPO_DIR"
          git reset --hard
          git pull origin "$BRANCH"
          
          cd ~
          if [ ! -d infra ]; then
          mkdir infra
          fi
          cp -r ./Nomat/infra/app/* infra
          cp .env ./infra/.env
          cd infra
          
          export $(xargs < .env)
          NOMAT_TAG=${{ github.sha }} docker stack config -c compose.yml | sudo docker stack deploy -c - nomat-back
          '
