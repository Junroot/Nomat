name: push "back" to develop branch
on:
  workflow_dispatch:
  push:
    branches:
      - "develop"
    paths:
      - "back/**"
jobs:
  build:
    name: Push Docker image to Docker Hub
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: docker hub login
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: docker hub push
        uses: docker/build-push-action@v6
        with:
          context: ./back
          push: true
          tags: junroot0909/nomat:latest, junroot0909/nomat:${{ github.sha }}
      - name: deploy docker compose to EC2
        env:
          PRIVATE_KEY: ${{ secrets.EC2_PRIVATE_KEY }}
          HOST: ${{ secrets.EC2_HOST }}
          USER: ${{ secrets.EC2_USER }}
          GITHUB_REF: ${{ github.ref }}
          TAG: ${{ github.sha }}
        run: |
          echo "$PRIVATE_KEY" > github-ec2.pem && chmod 600 github-ec2.pem
          ssh -o StrictHostKeyChecking=no -i github-ec2.pem ${USER}@${HOST}
          echo "Current directory: $(pwd)"
          echo "Listing home directory:"
          ls -la ~

          curl -O https://raw.githubusercontent.com/Junroot/Nomat/${GITHUB_REF}/back/kubernetes/back-deployment.yaml
          docker compose up -d
