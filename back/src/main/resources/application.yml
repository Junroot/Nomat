spring:
  profiles:
    default: local
---
server:
  forward-headers-strategy: framework
  tomcat:
    accesslog:
      enabled: true
      pattern: 'header:"%{X-Forwarded-For}i" url:%h %l %u %t \"%r\" %>s %b'
      prefix: stdout
      directory: /dev
      suffix:
      file-date-format:
spring:
  config:
    activate:
      on-profile: local | test
  flyway:
    clean-disabled: false
  jpa:
    show-sql: true
    hibernate:
      ddl-auto: validate
  security:
    oauth2:
      client:
        registration:
          discord:
            authorization-grant-type: authorization_code
            redirect-uri: "{baseUrl}/login/oauth2/code/discord"
            scope:
              - identify
              - email
        provider:
          discord:
            authorization-uri: https://discord.com/oauth2/authorize
            token-uri: https://discord.com/api/oauth2/token
            user-info-uri: https://discord.com/api/users/@me
            user-name-attribute: username
app:
  cors:
    origins: http://localhost:3000/
jwt:
  key: cGFzc3dvcmRwYXNzdzByZHBhNTV3MHJkcGE1NXdvcmQ
  domain: localhost
---
server:
  forward-headers-strategy: framework
  tomcat:
    accesslog:
      enabled: true
      pattern: 'header:"%{X-Forwarded-For}i" url:%h %l %u %t \"%r\" %>s %b'
      prefix: stdout
      directory: /dev
      suffix:
      file-date-format:
spring:
  config:
    activate:
      on-profile: dev
  datasource:
    hikari:
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000
      maximum-pool-size: 10
      minimum-idle: 10
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    show-sql: true
    hibernate:
      ddl-auto: validate
  security:
    oauth2:
      client:
        registration:
          discord:
            authorization-grant-type: authorization_code
            redirect-uri: "https://api.dev.nomat.live/login/oauth2/code/discord"
            scope:
              - identify
              - email
        provider:
          discord:
            authorization-uri: https://discord.com/oauth2/authorize
            token-uri: https://discord.com/api/oauth2/token
            user-info-uri: https://discord.com/api/users/@me
            user-name-attribute: username
app:
  cors:
    origins: https://dev.nomat.live
jwt:
  domain: dev.nomat.live
