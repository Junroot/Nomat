schema: spec-driven

context: |
  프로젝트: Nomat — 노래 맞히기 게임 애플리케이션
  모노레포 구조: back/ (Kotlin/Spring Boot API), front/ (React SPA), infra/ (Docker Swarm·Nginx·Prometheus·Kibana 등)
  메인 브랜치: develop

  출력 언어:
  - 모든 아티팩트 본문은 한국어로 작성
  - 커밋 메시지는 한국어 Conventional Commits (feat:, fix: 등)
  - UI 텍스트·에러 메시지는 한국어

  기술 스택:
  - 백엔드: Kotlin 1.9 / Spring Boot 3.4 / Java 17 / Gradle
  - 프론트엔드: React 19 / React Router v7 (SPA) / Vite 5 / TypeScript / Tailwind CSS v4 / Zustand
  - 데이터: MySQL 8 + Flyway, Elasticsearch 9 (Nori 한국어 분석기), Redis, Kafka
  - 인증: Discord OAuth2 + JWT
  - CDC: Debezium 임베디드 (MySQL → Kafka → Elasticsearch 플레이리스트 동기화)
  - 배포: Docker Swarm (백엔드, EC2), Netlify (프론트엔드)

  백엔드 아키텍처 — 헥사고날:
  - 기본 패키지 ilpak.nomat. 도메인 모듈: playlist, room, player, favoriteplaylist, auth
  - 모듈 구조: module/in (인바운드 어댑터), module/out (아웃바운드 어댑터), module/application/{domain,dto,*Service.kt}
  - 컨트롤러와 저장소 구현체는 `private class` — 패키지 외부 참조 불가
  - 도메인 이벤트는 AbstractAggregateRoot + @TransactionalEventListener(AFTER_COMMIT) 패턴
  - 횡단 관심사는 infrastructure/ 패키지 (security, web, redis, cdc, container, jpa, elasticsearch)

  프론트엔드 아키텍처:
  - 라우트는 app/routes.ts에서 수동 정의, `~/`는 ./app/ 별칭
  - SVG는 ?react 접미사로 컴포넌트 임포트
  - API 호출은 app/utils/api.ts의 Axios 클라이언트로 중앙 관리
  - 다크 테마 — Tailwind zinc 팔레트, cyan-400 액센트

  프로파일:
  - local/test: Testcontainers로 외부 의존성 자동 구성 (자격 증명 불필요)
  - dev: 환경 변수로 외부 서비스 연결

  세부 가이드는 back/CLAUDE.md, front/CLAUDE.md 참조.

rules:
  proposal:
    - Impact 섹션에 영향 받는 서브프로젝트(back/front/infra)와 도메인 모듈(playlist/room/player/favoriteplaylist/auth)을 명시할 것
    - 백엔드 변경이 있다면 어떤 헥사고날 계층(in/out/application)에 영향을 주는지 표기할 것
    - DB 스키마·ES 매핑·Kafka 토픽·Redis 키 영향이 있으면 Impact에 별도 항목으로 분리해 적을 것
    - "범위 가드 — proposal 초안을 쓰기 전에 다음 분리 신호를 점검할 것. (1) 독립 배포 가능한 서브프로젝트(back/front/infra)를 2개 이상 동시 변경 (2) 추가·수정하는 capability(spec)가 3개 이상 (3) 예상 tasks 최상위 그룹이 3개 초과 또는 태스크 총 15개 초과 (4) 서로 독립적으로 출시·롤백 가능한 사용자 기능이 2개 이상 (5) 무관한 기능 작업과 DB 마이그레이션·인프라 변경이 한 change에 혼재. 신호가 2개 이상 걸리면, 이 change를 응집된 수직 슬라이스(독립 PR·독립 롤백 가능한 end-to-end capability) 하나로 좁히고 나머지는 후속 change로 분리할 것을 사용자에게 제안한 뒤 동의를 받고 진행할 것 — 동의 없이 한 change에 전부 욱여넣지 말 것"
    - 분리할 때는 계층별 수평 분할(백엔드 전부 / 프론트 전부)이 아니라 수직 슬라이스를 기본으로 하되, 계층이 실제로 따로 배포되는 경우에만 수평 분할을 쓸 것
    - 분리에 동의하면 `/opsx:epic`(openspec-epic 스킬)으로 그룹을 총괄하는 epic 문서(`openspec/epic/<name>.md`)를 먼저 만든 뒤 각 change를 스캐폴드할 것. 규약은 `openspec/epic/README.md`를 따른다
    - "epic에 속한 change면 proposal 첫머리에 `**Epic**: [<epic-name>](../../epic/<epic-name>.md)` 라인을 두어 change → epic 역참조를 유지할 것(epic 문서의 구성 change 표와 양방향)"

  specs:
    - "capability 이름은 도메인 모듈명과 일관된 kebab-case로 작성할 것 (예: playlist-search, room-session)"
    - Requirement 본문과 Scenario 설명은 한국어로 작성하되 WHEN/THEN 등 키워드는 영문 그대로 유지할 것
    - 외부 시스템(MySQL/ES/Redis/Kafka/Discord OAuth)에 의존하는 시나리오는 어떤 시스템과 상호작용하는지 명시할 것

  design:
    - DB 스키마 변경 시 Flyway 마이그레이션 버전 번호와 무중단 배포 영향(롤백 가능 여부 포함)을 명시할 것
    - Elasticsearch 매핑·Debezium CDC 흐름에 영향을 주는 변경은 별도 섹션으로 분리해 영향 범위를 적을 것
    - Redis Pub/Sub 채널·Kafka 토픽 추가/변경은 토픽명, 메시지 스키마, consumer/producer 위치를 명시할 것
    - 새로운 도메인 모듈을 추가하면 헥사고날 패키지 배치(in/out/application)와 포트 인터페이스를 다이어그램 또는 클래스 목록으로 보일 것

  tasks:
    - 작업 그룹은 back/front/infra 단위로 분리할 것
    - 백엔드 작업 그룹은 마지막에 `./gradlew test` 및 `./gradlew detekt` 실행 태스크를 포함할 것
    - 프론트엔드 작업 그룹은 마지막에 `npm run typecheck` 및 `npm run build` 실행 태스크를 포함할 것
    - 백엔드 테스트는 Testcontainers 기반 기존 패턴(local/test 프로파일)을 따를 것 — 새 mock 인프라를 도입하지 말 것
    - 컨트롤러·저장소 구현체를 추가하는 태스크에는 `private class` 가시성을 유지한다는 점을 명시할 것
    - 최상위 작업 그룹이 3개를 초과하거나 태스크가 총 15개를 넘으면 change 범위가 과대하다는 신호다. tasks를 더 잘게 쪼개기 전에, proposal 범위 가드 기준으로 change 자체를 분리할지 사용자에게 먼저 확인할 것
