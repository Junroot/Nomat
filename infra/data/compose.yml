services:
  db:
    image: mysql:8.0.39
    container_name: db
    ports:
      - "3306:3306"
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
      MYSQL_DATABASE: nomat
      MYSQL_USER: ${DB_USERNAME}
      MYSQL_PASSWORD: ${DB_PASSWORD}
    volumes:
      - db-data:/var/lib/mysql
  elasticsearch:
    image: junroot0909/elasticsearch-nori:9.0.4
    container_name: elasticsearch
    ports:
      - "9200:9200"
      - "9300:9300"
    environment:
      node.name: elasticsearch
      ES_JAVA_OPTS: -Xms512m -Xmx512m
      ELASTIC_PASSWORD: ${ELASTIC_PASSWORD:-}
      discovery.type: single-node
      xpack.license.self_generated.type: basic
    volumes:
      - elasticsearch-data:/usr/share/elasticsearch/data:Z
      - ./elasticsearch.yml:/usr/share/elasticsearch/config/elasticsearch.yml:ro,Z
    networks:
      - elk
    restart: unless-stopped
  logstash:
    image: docker.elastic.co/logstash/logstash:9.0.4
    container_name: logstash
    ports:
      - "5044:5044"
      - "50000:50000/tcp"
      - "50000:50000/udp"
      - "9600:9600"
    environment:
      LS_JAVA_OPTS: -Xms256m -Xmx256m
      ELASTIC_PASSWORD: ${ELASTIC_PASSWORD:-}
    volumes:
      - ./logstash-config.yml:/usr/share/logstash/config/logstash.yml:ro,Z
      - ./logstash-pipeline.conf:/usr/share/logstash/pipeline/logstash.conf:ro,Z
    networks:
      - elk
    depends_on:
      - elasticsearch
    restart: unless-stopped
  node-exporter:
    image: prom/node-exporter:v1.9.1
    container_name: node-exporter
    ports:
      - "9100:9100"
  redis:
    image: redis:7.4.7
    container_name: redis
    ports:
      - "6379:6379"
volumes:
  db-data:
  elasticsearch-data:
networks:
  elk:
    driver: bridge

