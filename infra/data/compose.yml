services:
  db:
    image: mysql:8.0.39
    container_name: db
    ports:
      - "3306:3306"
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
      MYSQL_DATABASE: nomat
      MYSQL_USER: ${DB_USERNAME}
      MYSQL_PASSWORD: ${DB_PASSWORD}
    volumes:
      - db-data:/var/lib/mysql
  elasticsearch:
    image: junroot0909/elasticsearch-nori:9.0.4
    container_name: elasticsearch
    ports:
      - "9200:9200"
      - "9300:9300"
    environment:
      node.name: elasticsearch
      ES_JAVA_OPTS: -Xms512m -Xmx512m
      ELASTIC_PASSWORD: ${ELASTIC_PASSWORD:-}
      discovery.type: single-node
      xpack.license.self_generated.type: basic
    volumes:
      - elasticsearch-data:/usr/share/elasticsearch/data:Z
      - ./elasticsearch.yml:/usr/share/elasticsearch/config/elasticsearch.yml:ro,Z
    restart: unless-stopped
  alloy:
    image: grafana/alloy:v1.10.0
    container_name: alloy
    command:
      - run
      - --server.http.listen-addr=0.0.0.0:12345
      - --storage.path=/var/lib/alloy/data
      - /etc/alloy/config.alloy
    environment:
      GRAFANA_CLOUD_LOKI_URL: ${GRAFANA_CLOUD_LOKI_URL}
      GRAFANA_CLOUD_LOKI_USER: ${GRAFANA_CLOUD_LOKI_USER}
      GRAFANA_CLOUD_MIMIR_URL: ${GRAFANA_CLOUD_MIMIR_URL}
      GRAFANA_CLOUD_MIMIR_USER: ${GRAFANA_CLOUD_MIMIR_USER}
      GRAFANA_CLOUD_API_TOKEN: ${GRAFANA_CLOUD_API_TOKEN}
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ./alloy-config.alloy:/etc/alloy/config.alloy:ro
    networks:
      - observability
    restart: unless-stopped
  node-exporter:
    image: prom/node-exporter:v1.9.1
    container_name: node-exporter
    ports:
      - "9100:9100"
    networks:
      - observability
  redis:
    image: redis:7.4.7
    container_name: redis
    ports:
      - "6379:6379"
volumes:
  db-data:
  elasticsearch-data:
networks:
  observability:
    driver: bridge
