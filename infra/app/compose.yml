services:
  spring-app:
    image: junroot0909/nomat:${NOMAT_TAG:-latest}
    # 앱의 graceful shutdown 페이즈 타임아웃(spring.lifecycle.timeout-per-shutdown-phase=20s)보다 길어야 한다.
    # 종료 시 열린 WebSocket 세션을 닫고 그 끊김(퇴장 유예 예약)이 Redis에 기록될 시간을 확보한다. Swarm 기본값은 10s.
    stop_grace_period: 30s
    deploy:
      replicas: 2
      restart_policy:
        delay: 5s
        max_attempts: 3
        window: 60s
      update_config:
        parallelism: 1
        delay: 10s
        monitor: 60s
        failure_action: rollback
        order: start-first
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8081/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    environment:
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE}
      SPRING_DATASOURCE_URL: jdbc:mysql://${DB_URL}/nomat
      SPRING_DATASOURCE_USERNAME: ${DB_USERNAME}
      SPRING_DATASOURCE_PASSWORD: ${DB_PASSWORD}
      SPRING_SECURITY_OAUTH2_CLIENT_REGISTRATION_DISCORD_CLIENTID: ${OAUTH2_CLIENT_REGISTRATION_DISCORD_CLIENT_ID}
      SPRING_SECURITY_OAUTH2_CLIENT_REGISTRATION_DISCORD_CLIENTSECRET: ${OAUTH2_CLIENT_REGISTRATION_DISCORD_CLIENT_SECRET}
      ELASTICSEARCH_HOSTS: ${ELASTICSEARCH_HOSTS}
      ELASTICSEARCH_USERNAME: ${ELASTICSEARCH_USERNAME}
      ELASTICSEARCH_PASSWORD: ${ELASTICSEARCH_PASSWORD}
      JWT_KEY: ${JWT_KEY}
      REDIS_HOST: ${REDIS_HOST}
      REDIS_PORT: ${REDIS_PORT}
    networks:
      - backend
  nginx:
    image: nginx:alpine
    ports:
      - target: 80
        published: 80
        mode: host
    networks:
      - backend
    configs:
      - source: nginx_conf-5
        target: /etc/nginx/nginx.conf
  alloy:
    image: grafana/alloy:v1.10.0
    command:
      - run
      - --server.http.listen-addr=0.0.0.0:12345
      - --storage.path=/var/lib/alloy/data
      - /etc/alloy/config.alloy
    deploy:
      mode: global
    environment:
      GRAFANA_CLOUD_LOKI_URL: ${GRAFANA_CLOUD_LOKI_URL}
      GRAFANA_CLOUD_LOKI_USER: ${GRAFANA_CLOUD_LOKI_USER}
      GRAFANA_CLOUD_MIMIR_URL: ${GRAFANA_CLOUD_MIMIR_URL}
      GRAFANA_CLOUD_MIMIR_USER: ${GRAFANA_CLOUD_MIMIR_USER}
      GRAFANA_CLOUD_API_TOKEN: ${GRAFANA_CLOUD_API_TOKEN}
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    configs:
      - source: alloy_config-3
        target: /etc/alloy/config.alloy
    networks:
      - observability
      - backend
  node-exporter:
    image: prom/node-exporter:latest
    networks:
      - observability
networks:
  backend:
    name: backend
    driver: overlay
    attachable: true
  observability:
    driver: overlay
configs:
  # config 파일은 수정이 필요하면, config key 값을 변경해야 적용 됨
  nginx_conf-5:
    file: ./nginx.conf
  alloy_config-3:
    file: ./alloy-config.alloy
